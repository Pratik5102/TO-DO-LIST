<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO LIST</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>TO-DO-LIST</h1>
        <p>Daily Tasks</p>

        <form>
            <input
                type="text"
                id="input"
                placeholder="Enter your task"
            >

            <button id="button" type="submit">Add</button>
        </form>

        <p id="task-count">0 tasks left</p>

        <div class="filters">
            <button
                class="filter-btn active"
                data-filter="all"
                type="button"
            >
                All
            </button>

            <button
                class="filter-btn"
                data-filter="active"
                type="button"
            >
                Active
            </button>

            <button
                class="filter-btn"
                data-filter="completed"
                type="button"
            >
                Completed
            </button>
        </div>

        <button id="clear-completed" type="button">
            Clear Completed
        </button>

        <ul id="list"></ul>
    </div>

    <script src="script.js"></script>

</body>
</html>
